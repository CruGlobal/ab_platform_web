name: Unit Tests
on: push
jobs:
   unit-tests:
      name: Unit Tests
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@v4
           with:
              submodules: true
         - uses: actions/setup-node@v4
           with:
              node-version: 22
              cache: pnpm
              cache-dependency-path: pnpm-lock.yaml
         - uses: pnpm/action-setup@v4
           with:
              version: 11.0.6
         - run: pnpm install --frozen-lockfile
         - run: pnpm test
